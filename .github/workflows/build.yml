name: Desktop CI and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede branch/PR checks. Never cancel a release in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate workflow and release metadata
    # Feature branches are covered by their PR; the default branch gets post-merge checks.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Test CI selection and version checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check versions and select work
        id: scope
        run: python3 .github/scripts/ci.py

  build:
    name: Check and build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-universal
          - os: windows-latest
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install universal Mac targets
        if: needs.prepare.outputs.package == 'true' && runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ needs.prepare.outputs.package == 'true' && 'package' || 'check' }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run fmt:check
      # Tauri's native build embeds dist/, so build it before Clippy and tests.
      - run: npm run build
      - run: npm run lint:rust
      - run: npm test
      - run: npx playwright install chrome
      - run: npm run test:ui
      - name: Build Mac apps and DMGs
        if: needs.prepare.outputs.package == 'true' && runner.os == 'macOS'
        run: |
          npm run build:mac -- --ci -- --locked
          for architecture in arm64 x86_64; do
            lipo "src-tauri/target/universal-apple-darwin/release/bundle/macos/KSD Decrypt.app/Contents/MacOS/ksd-decrypt" -verify_arch "$architecture"
          done
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/KSD-Decrypt-macOS-universal.dmg
          # The universal build already compiled both executables. Bundle each
          # architecture separately without repeating the Rust compilation.
          for pair in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x64; do
            target="${pair%:*}"
            architecture="${pair#*:}"
            npm run tauri -- bundle --target "$target" --bundles app,dmg --ci
            expected_arch="$architecture"
            if [[ "$architecture" == x64 ]]; then expected_arch=x86_64; fi
            test "$(lipo -archs "src-tauri/target/$target/release/bundle/macos/KSD Decrypt.app/Contents/MacOS/ksd-decrypt")" = "$expected_arch"
            cp "src-tauri/target/$target/release/bundle/dmg/"*.dmg "release-assets/KSD-Decrypt-macOS-$architecture.dmg"
          done
      - name: Build Windows x64 installers
        if: needs.prepare.outputs.package == 'true' && runner.os == 'Windows'
        run: |
          npm run build:windows -- --ci -- --locked
          mkdir -p release-assets
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release-assets/KSD-Decrypt-Windows-x64-setup.exe
          # Keep the standard download more than 10x smaller than v1.0.0
          # (218,055,318 bytes), even as the application grows.
          python3 -c 'from pathlib import Path; size = Path("release-assets/KSD-Decrypt-Windows-x64-setup.exe").stat().st_size; print(f"Standard Windows installer: {size:,} bytes"); assert 0 < size <= 20 * 1024**2, "Standard installer exceeds the 20 MiB budget"'
          npm run tauri -- bundle --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-offline.conf.json --ci
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release-assets/KSD-Decrypt-Windows-x64-offline-setup.exe
      - name: Save installers
        uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.package == 'true'
        with:
          name: KSD-Decrypt-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/*
          compression-level: 0
          retention-days: 14

  checks:
    name: Desktop checks
    needs: [prepare, build]
    # Report real failures, but do not turn a cancelled run into a failed check.
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only change
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME: ${{ needs.prepare.outputs.runtime }}
        run: |
          test "$PREPARE_RESULT" = success
          if [[ "$RUNTIME" == true ]]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi

  release:
    name: Publish installers
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: KSD-Decrypt-*
          merge-multiple: true
          path: release-assets
      - name: Verify all installers and create checksums
        working-directory: release-assets
        run: |
          test -s KSD-Decrypt-macOS-universal.dmg
          test -s KSD-Decrypt-macOS-arm64.dmg
          test -s KSD-Decrypt-macOS-x64.dmg
          test -s KSD-Decrypt-Windows-x64-setup.exe
          test -s KSD-Decrypt-Windows-x64-offline-setup.exe
          sha256sum KSD-Decrypt-macOS-*.dmg KSD-Decrypt-Windows-x64-*.exe > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publish-release.sh

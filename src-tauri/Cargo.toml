[package]
name = "ksd-decrypt"
version = "1.0.1"
description = "Private recovery for legacy KeepSafe photos and videos"
authors = ["KSD Decrypt contributors"]
edition = "2024"
rust-version = "1.85"
default-run = "ksd-decrypt"

[lib]
name = "ksd_decrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Keep the usual desktop features except dynamic-acl: permissions are fixed at
# build time, so runtime capability registration and its metadata are unused.
tauri = { version = "2.11.6", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes = "0.8"
ctr = "0.9"
crc32fast = "1"
sha2 = "0.10"
infer = "0.19"
memchr = "2"
tempfile = "3"
walkdir = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10 gates ARM hardware acceleration behind asm. Scope it to Apple
# silicon: sha2-asm does not support Windows. Runtime CPU detection is retained.
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[profile.release]
# Preserve streaming recovery throughput; remove unused IPC code for size.
opt-level = 3
codegen-units = 1
lto = true
strip = true

# Build-time proc macros are loaded by the compiler, not shipped. Stripping
# their dylibs can produce invalid LINKEDIT alignment on macOS 27.
[profile.release.build-override]
strip = false
